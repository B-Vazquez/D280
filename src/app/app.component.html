<div class="container">
    <div class="left-col" >
        <app-map
            (countryName)="selectedName = $event"
            (countryCapital)="selectedCapital = $event"
            (countryRegion)="selectedRegion = $event"
            (countryIncome)="selectedIncome = $event"
            (countryLong)="selectedLong = $event"
            (countryLat)="selectedLat = $event"
        ></app-map>
    </div>
    <div class="right-col">
        <app-map-info
            [countryName]="selectedName"
            [countryCapital]="selectedCapital"
            [countryRegion]="selectedRegion"
            [countryIncome]="selectedIncome"
            [countryLong]="selectedLong"
            [countryLat]="selectedLat"
        ></app-map-info>
    </div>>
</div>
